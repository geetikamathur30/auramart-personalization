
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AuraMart | Product</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">Aura<span>Mart</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="category.html">Shop</a>
      <a href="cart.html">Cart <b id="cartCount"></b></a>
    </nav>
  </header>

  <main id="product" class="detail"></main>

  <footer>AuraMart Personalization Demo</footer>

  <!-- Existing website scripts -->
  <script src="products.js"></script>
  <script src="cart.js"></script>

  <script>
    const p = getProduct(
      new URLSearchParams(location.search).get("id") || "P001"
    );

    document.title = "AuraMart | " + p.name;

    document.querySelector("#product").innerHTML = `
      <img src="${p.image}" alt="${p.name}">
      <div>
        <small>${p.category}</small>
        <h1>${p.name}</h1>
        <h3>${money(p.price)}</h3>
        <p>${p.description}</p>
        <label>
          Quantity
          <input id="qty" type="number" min="1" value="1">
        </label>
        <br>
        <button class="btn" id="add">Add to cart</button>
        <a class="btn outline" href="cart.html">View cart</a>
        <p id="msg"></p>
      </div>
    `;

    document.querySelector("#add").onclick = () => {
      addToCart(
        p.id,
        Math.max(1, +document.querySelector("#qty").value || 1)
      );
      document.querySelector("#msg").textContent = "Added to cart.";
    };
  </script>

  <!-- Salesforce Personalization SDK: load first -->
  <script src="https://cdn.c360a.salesforce.com/beacon/c360a/147276f6-d080-44f3-87d9-e990c01599fd/scripts/c360a.min.js"></script>

  <!-- Your generated Salesforce Personalization sitemap -->
  <script src="/auramart-personalization/sitemap.js"></script>
</body>
</html>
