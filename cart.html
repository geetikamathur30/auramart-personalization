<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AuraMart | Cart</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">Aura<span>Mart</span></a><nav><a href="index.html">Home</a><a href="category.html">Shop</a><a href="cart.html">Cart <b id="cartCount"></b></a></nav></header><section class="pageHead"><small>SHOPPING</small><h1>Your Cart</h1></section><main class="section"><div id="cart"></div></main><footer>AuraMart Personalization Demo</footer><script src="products.js"></script><script src="cart.js"></script><script>function draw(){const x=document.querySelector("#cart"),items=details();if(!items.length){x.innerHTML='<div class="empty"><h2>Your cart is empty</h2><a class="btn" href="category.html">Continue shopping</a></div>';return;}x.innerHTML=items.map(i=>`<article class="cartItem"><img src="${i.image}"><div><h3>${i.name}</h3><p>${money(i.price)} each</p><label>Qty <input class="q" data-id="${i.id}" type="number" min="1" value="${i.quantity}"></label><button class="remove" data-id="${i.id}">Remove</button></div><strong>${money(i.total)}</strong></article>`).join("")+`<div class="summary"><p>Total <strong>${money(total())}</strong></p><a class="btn" href="checkout.html">Proceed to checkout</a></div>`;document.querySelectorAll(".q").forEach(e=>e.onchange=()=>{setQty(e.dataset.id,e.value);draw()});document.querySelectorAll(".remove").forEach(e=>e.onclick=()=>{removeItem(e.dataset.id);draw()})}draw();</script></body></html>
