<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AuraMart | Checkout</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">Aura<span>Mart</span></a><nav><a href="index.html">Home</a><a href="category.html">Shop</a><a href="cart.html">Cart <b id="cartCount"></b></a></nav></header><section class="pageHead"><small>CHECKOUT</small><h1>Complete your order</h1></section><main class="section"><form id="form" class="form"><label>Full name<input required name="name"></label><label>Email<input required type="email" name="email"></label><label>Phone<input required name="phone"></label><label>Postal code<input required name="postal"></label><label class="full">Address<textarea required name="address"></textarea></label><label class="full">Payment<select name="payment"><option>Card</option><option>UPI</option><option>Cash on Delivery</option></select></label><div class="summary full">Order total: <strong id="total"></strong><br><button class="btn" type="submit">Place order</button></div></form></main><footer>AuraMart Personalization Demo</footer><script src="products.js"></script><script src="cart.js"></script><script>document.querySelector("#total").textContent=money(total());document.querySelector("#form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const order={id:"ORD-"+Math.floor(10000+Math.random()*90000),total:total(),currency:"INR",items:details(),customer:Object.fromEntries(f.entries())};sessionStorage.setItem("order",JSON.stringify(order));clearCart();location.href="confirmation.html"};</script></body></html>
